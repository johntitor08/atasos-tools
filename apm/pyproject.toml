[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apm"
version = "0.2.0"
description = "atasOS package manager (prototype)"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
zstd = ["zstandard"]
test = ["pytest"]

[project.scripts]
apm = "apm.cli:main"
apm-mkpkg = "apm.mkpkg:main"

[tool.setuptools]
packages = ["apm"]
