# atasOS: nouveau yalniz EKRAN (VGA) sinifinda bir NVIDIA karti varsa yuklenir.
# Hibrit (Optimus) dizustulerde NVIDIA karti "3D denetleyici"dir (PCI sinifi 0x0302), ekran cikisi yoktur ve
# cogunlukla kapali tutulur. nouveau onu baslatmaya calisinca cokebiliyor (6.18'de MX250/GP108: gp102_acr_wpr_patch
# sayfa hatasi) ve aygit kilidini tuttugu icin yeniden baslatma sonsuza dek bekliyordu. Masaustu bu makinelerde
# zaten Intel/AMD ile calisir. Ekrani NVIDIA'da olan masaustu bilgisayarlarda nouveau eskisi gibi yuklenir.
# Elle yuklemek gerekirse: modprobe --ignore-install nouveau
install nouveau /usr/lib/atasos/nouveau-yukle
